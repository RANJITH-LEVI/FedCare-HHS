version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: fedcare-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/fedcare.db
    volumes:
      - fedcare_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: fedcare-frontend
    ports:
      - "8501:8501"
    environment:
      - FEDCARE_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fedcare_data:
